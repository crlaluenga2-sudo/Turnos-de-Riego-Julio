function getGroups(slots) {
  const groups = [];
  let start = null, prevEnd = null;
  for (let i = 0; i < slots.length; i++) {
    const sm = SLOTS_META[i];
    if (sm.is_gap) {
      if (start !== null) { groups.push(start + ' – ' + prevEnd); start = null; prevEnd = null; }
      continue;
    }
    if (slots[i] === 1) {
      if (start === null) { start = sm.start; prevEnd = sm.end; }
      else if (sm.start === prevEnd) { prevEnd = sm.end; }
      else { groups.push(start + ' – ' + prevEnd); start = sm.start; prevEnd = sm.end; }
    } else {
      if (start !== null) { groups.push(start + ' – ' + prevEnd); start = null; prevEnd = null; }
    }
  }
  if (start !== null) groups.push(start + ' – ' + prevEnd);
  return groups;
}

function renderBar(slots) {
  return slots.map((v, i) => {
    const sm = SLOTS_META[i];
    const w = SLOT_WIDTHS[i] + '%';
    if (sm.is_gap) return `<div class="slot-gap" style="width:${w}"></div>`;
    if (v === 1)   return `<div class="slot-on"  style="width:${w}" title="${sm.start}–${sm.end}"></div>`;
                   return `<div class="slot-off" style="width:${w}" title="${sm.start}–${sm.end}"></div>`;
  }).join('');
}

function renderAxis() {
  const n = AXIS.length;
  return '<div class="timeline-axis">' +
    AXIS.map((a, i) => {
      const cls = i === 0 ? 'axis-label first' : i === n-1 ? 'axis-label last' : 'axis-label';
      return `<span class="${cls}" style="left:${a.pct}%">${a.label}</span>`;
    }).join('') +
  '</div>';
}

function renderFicha(nombre, parcelas) {
  const rows = parcelas.map(p => {
    const groups = getGroups(p.slots);
    const horarioHtml = groups.length === 0
      ? `<div class="horario-badge sin">Sin asignar</div>`
      : groups.map(g => `<div class="horario-badge">🕐 ${g}</div>`).join('');
    return `<div class="parcela-row">
      <div class="parcela-nombre">${p.parcela || '—'}</div>
      <div class="parcela-modulos">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        ${p.modulos} módulo${p.modulos !== 1 ? 's' : ''}
      </div>
      <div class="timeline-label">Ventana de riego</div>
      <div class="timeline-bar">${renderBar(p.slots)}</div>
      ${renderAxis()}
      <div class="horarios-wrap">${horarioHtml}</div>
    </div>`;
  }).join('');
  return `<div class="ficha">
    <div class="ficha-header">
      <div class="ficha-nombre">${nombre}</div>
      <div class="ficha-count">${parcelas.length} parcela${parcelas.length !== 1 ? 's' : ''}</div>
    </div>${rows}</div>`;
}

function render(query) {
  const q = query.trim().toLowerCase();
  const results = document.getElementById('results');
  const statsText = document.getElementById('statsText');
  const names = Object.keys(DATA);
  const filtered = q ? names.filter(n => n.toLowerCase().includes(q)) : names;
  if (!filtered.length) {
    results.innerHTML = `<div class="empty"><div class="big">🌾</div><p>No se encontró ningún regante con ese nombre.</p></div>`;
    statsText.innerHTML = `Sin resultados para "<strong>${query}</strong>"`;
    return;
  }
  statsText.innerHTML = q
    ? `<strong>${filtered.length}</strong> regante${filtered.length !== 1 ? 's' : ''} encontrado${filtered.length !== 1 ? 's' : ''}`
    : `<strong>${filtered.length}</strong> regantes en total`;
  results.innerHTML = filtered.map(n => renderFicha(n, DATA[n])).join('');
}
